name: Currency Exchange layout refresh

# FALLBACK, NOT PRIMARY (since Phase C, 2026-09-03).
#
# The layout is now refreshed at runtime: pg_cron -> /api/cron/data-refresh ->
# refreshExchangeLayout (apps/web/lib/data-refresh.js) reparses the same pages
# with the same shared parser (src/domain/exchange-layout-parse.js) and writes
# the `exchange_layout` table (supabase/migrations/011_layout_gold.sql). Readers
# merge DB > committed JSON, per item, so a new category reaches the site the
# next morning instead of the next merged PR.
#
# This workflow stays as the safety net: it keeps the committed
# src/data/exchange-layout-*.json snapshot — the cold-start fallback when there
# is no database, the migration is unapplied, or the job has never run — from
# going stale, and it is the way a layout change gets a human review. It does
# NOT write to Supabase and needs no new secrets. If it and the DB job ever
# disagree, the DB job wins at runtime; check /api/status `layout.fetchedAt` and
# the `data-refresh` cron trace before assuming this PR flow is the problem.
#
# The in-game exchange table changes with patches and league launches. This
# daily probe writes nothing when category/section/item content is unchanged;
# when it does change, it opens a reviewable PR instead of silently deploying.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh PoE 1 and PoE 2 in-game layouts
        run: npm run layout:build
        env:
          # A scheduled probe should not alert when PoEDB is temporarily down.
          # Manual runs still fail after retries so maintainers can diagnose them.
          LAYOUT_REFRESH_ALLOW_STALE_ON_TRANSIENT_FAILURE: ${{ github.event_name == 'schedule' }}

      - name: Verify generated layouts
        run: npm test

      - name: Open a PR if the layout changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): refresh Currency Exchange layout"
          title: "chore(data): refresh Currency Exchange layout"
          body: |
            Automated snapshot refresh from the client-derived Currency
            Exchange tables exposed by PoEDB/PoE2DB. This includes category,
            section, and item order for both games. Review before merging;
            nothing auto-deploys.
          branch: automated/exchange-layout-refresh
          delete-branch: true
