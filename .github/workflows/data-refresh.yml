name: Data refresh (catalog / identity / gold costs)

# Keeps the committed GGG-derived snapshots (catalog-poe2.json,
# cx-identity-poe1/2.json, gold-costs-poe2.js) from silently going stale.
# These are metadata/gold-cost tables that change roughly with league
# launches and balance patches, not hourly — so this is a low-frequency
# maintenance job, not a live/runtime pipeline. It never auto-merges: a
# human reviews the diff before any of this reaches production, per this
# repo's honesty rule (never silently change what's shown to users).
#
# League auto-sync (service:leagues) is a separate, still-blocked track —
# see docs/BACKLOG.md T1-T4 — because it needs a GGG OAuth scope grant, not
# a refresh script.

on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh catalog metadata, identity maps, and gold costs
        run: npm run data:refresh

      - name: Run the test suite against the refreshed data
        run: npm test

      - name: Open a PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): scheduled catalog/identity/gold-cost refresh"
          title: "chore(data): scheduled catalog/identity/gold-cost refresh"
          body: |
            Automated refresh from `npm run data:refresh` (catalog metadata,
            RePoE identity maps, poe2db.tw gold costs). Review the diff before
            merging — nothing here auto-deploys.
          branch: automated/data-refresh
          delete-branch: true
